
<!DOCTYPE html>
<html lang="en">
<head>

<title>SimVest | Retail Simulation & Validation</title>
<style>
:root {

}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.layout{

.sidebar{

.brand{

.brand b{color:#8ea7ff}

.aside-title{

.nav{display:grid;gap:5px}

<div class="toast" id="toast" role="status"
  aria-live="polite"></div>

<script>
(() => {
"use strict";

// =======================================
// SIMVEST DATA STORAGE
// =======================================

const $ = id => document.getElementById(id);

const DRAFT = "simvest_draft_v05";
const SAVED = "simvest_projects_v05";
const ECON = "simvest_economic_v05";
const ACTUAL = "simvest_actual_v06";

const categories = {
  provisions: [
    "Provision store / mini-mart",
    5500,3600,35,90,300,950
  ],
  supermarket: [
    "Supermarket",
    6800,4750,95,220,700,2500
  ],
  electronics: [
    "Electronics & devices",
    95000,78500,5,22,35,130
  ],
  pharmacy: [
    "Pharmacy / health retail",
    8200,5900,65,130,300,1700
  ],
  fashion: [
    "Fashion & clothing",
    18500,10700,15,50,200,380
  ],
  ecommerce: [
    "Online retail (own inventory)",
    12000,8000,25,80,230,700
  ],
  wholesale: [
    "Wholesale / distribution",
    34000,28900,12,45,160,310
  ]
};

const cases = {
  base: {
    name:"Base case",
    detail:"Business as entered",
    demand:0,cost:0,price:0,fixed:0,month:1
  },
  demand: {
    name:"Demand falls",
    detail:"Demand -25% starting month 4",
    demand:-25,cost:0,price:0,fixed:0,month:4
  },
  costs: {
    name:"Cost shock",
    detail:"Purchases +25%, overhead +10%",
    demand:0,cost:25,price:0,fixed:10,month:4
  },
  growth: {
    name:"Growth",
    detail:"Demand +20%, overhead +10%",
    demand:20,cost:0,price:0,fixed:10,month:4
  },
  custom: {
    name:"Custom scenario",
    detail:"Set your own changes"
  }
};

const pageNames = {
  dashboard:"Dashboard",
  setup:"Business setup",
  simulation:"Simulation",
  scenarios:"Scenarios",
  validation:"Model validation",
  data:"Economic data",
  saved:"Saved projects"
};

const metricFields = {
  revenue:{name:"Revenue",model:"sales"},
  cogs:{name:"Cost of goods sold",model:"cogs"},
  expenses:{name:"Operating expenses",model:"expenses"},
  profit:{name:"Profit before tax",model:"profit"},
  cash:{name:"Closing cash",model:"cash"},
  inventory:{name:"Closing inventory value",model:"inventory"}
};

function read(key,def) {
  try {
    return JSON.parse(localStorage.getItem(key)) ?? def;
  } catch {
    return def;
  }
}

function store(key,value) {
  try {
    localStorage.setItem(key,JSON.stringify(value));
  } catch {
    notify("Storage blocked; changes may not persist");
  }
}

function uid() {
  return "sv-" + Date.now() + "-" +
    Math.random().toString(36).slice(2,8);
}

function defaults() {
  return {
    id:uid(),
    name:"My retail business",
    category:"provisions",
    city:"Lagos",
    area:"",
    start:"2023-01",
    months:12,

    capital:5000000,
    loan:0,
    annualInterest:18,
    loanTerm:24,
    setupCost:1000000,

    price:5500,
    unitCost:3600,
    dailyDemand:35,
    dailyCapacity:90,
    openDays:26,
    openingUnits:300,
    monthlyPurchases:950,
    shrinkage:1,

    rent:180000,
    salaries:240000,
    electricity:70000,
    otherCosts:95000,

    annualInflation:20,
    demandGrowth:0,
    priceGrowth:0,
    fxShare:0,
    fuelShare:0,

    custom:{
      demand:-15,
      cost:15,
      price:0,
      fixed:0,
      month:4
    }
  };
}

function esc(s) {
  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[c]
  );
}

function n(v,min=0,max=1e12) {
  return Math.min(max,Math.max(min,Number(v)||0));
}

function signed(v,min=-100,max=500) {
  return Math.min(max,Math.max(min,Number(v)||0));
}

function currency(v) {
  return (v<0?"−":"") +
    "₦" +
    Math.round(Math.abs(v||0)).toLocaleString("en-NG");
}

function compact(v) {
  const a=Math.abs(v||0);
  const pre=v<0?"−₦":"₦";

  return pre + (
    a>=1e9 ? (a/1e9).toFixed(2)+"bn" :
    a>=1e6 ? (a/1e6).toFixed(2)+"m" :
    a>=1e3 ? (a/1e3).toFixed(1)+"k" :
    Math.round(a)
  );
}

function monthAt(start,offset) {
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(start)){
    start="2023-01";
  }
  const [y,m]=start.split("-").map(Number);

  return new Date(
    Date.UTC(y,m-1+offset,1)
  ).toISOString().slice(0,7);
}

function previousMonth(month) {
  return monthAt(month,-1);
}

// Load existing SimVest business
let p={...defaults(),...read(DRAFT,{})};

p.custom={
  ...defaults().custom,
  ...p.custom
};

if(!p.id){
  p.id=uid();
  store(DRAFT,p);
}

// Economic records
let economic=read(ECON,{
  records:[],
  annual:{}
});

if(!Array.isArray(economic.records)){
  economic.records=[];
}

if(!economic.annual ||
  typeof economic.annual!=="object"){
  economic.annual={};
}

// Actual records are stored by business ID
let allActual=read(ACTUAL,{});

if(!allActual ||
  typeof allActual!=="object" ||
  Array.isArray(allActual)){
  allActual={};
}

let page="dashboard";
let scenario="base";
let metric="cash";
let validationMetric="revenue";

function notify(message) {
  const el=$("toast");
  el.textContent=message;
  el.classList.add("visible");

  clearTimeout(notify.timer);

  notify.timer=setTimeout(()=>{
    el.classList.remove("visible");
  },3000);
}

// =======================================
// ECONOMIC DATA ENGINE
// =======================================

function findEco(key,month) {
  return economic.records.find(
    r=>r.metric===key && r.month===month
  )?.value;
}

function changes(month,data) {
  const observed=findEco("cpi_mom",month);

  const annual=
    findEco("cpi_yoy",month) ??
    economic.annual[month.slice(0,4)];

  const rate=observed!==undefined
    ? Number(observed)/100
    : Math.pow(
        1+Math.max(
          -95,
          Number(annual ?? data.annualInflation)||0
        )/100,
        1/12
      )-1;

  function delta(key) {
    const current=findEco(key,month);
    const prior=findEco(key,previousMonth(month));

    return Number(current)>0 && Number(prior)>0
      ? current/prior-1
      : null;
  }

  const fx=delta("fx_ngn_usd");
  const fuel=delta("petrol_ngn_litre");

  const fxW=n(data.fxShare,0,100)/100;
  const fuelW=Math.min(
    1-fxW,n(data.fuelShare,0,100)/100
  );

  return {
    procurement:Math.max(
      .1,
      1+
      (1-fxW-fuelW)*rate+
      fxW*(fx??0)+
      fuelW*(fuel??0)
    ),

    fixed:Math.max(.1,1+rate),

    status:
      observed!==undefined
        ? "Monthly CPI"
        : annual!==undefined
        ? "Annual CPI estimate"
        : "Manual inflation assumption",

    fxAvailable:fx!==null,
    fuelAvailable:fuel!==null
  };
}

// =======================================
// RETAIL SIMULATION ENGINE
// =======================================

function simulate(data=p,scenarioName="base") {
  const shock=
    scenarioName==="custom"
      ? data.custom
      : cases[scenarioName];

  const rows=[];

  let purchasePrice=n(data.unitCost);
  let sellingPrice=n(data.price);
  let demand=n(data.dailyDemand);
  let stock=n(data.openingUnits);
  let avgCost=purchasePrice;

  let fixed=
    n(data.rent)+
    n(data.salaries)+
    n(data.electricity)+
    n(data.otherCosts);

  let cash=
    n(data.capital)+
    n(data.loan)-
    n(data.setupCost)-
    stock*purchasePrice;

  let debt=n(data.loan);
  const rate=n(data.annualInterest)/1200;
  const term=n(data.loanTerm,1,360);

  const loanPayment=debt
    ? (
        rate
          ? debt*rate/
            (1-Math.pow(1+rate,-term))
          : debt/term
      )
    : 0;

  for(let i=0;i<n(data.months,1,36);i++){
    const month=monthAt(data.start,i);
    const eco=changes(month,data);

    if(i){
      purchasePrice*=eco.procurement;
      fixed*=eco.fixed;

      sellingPrice*=
        1+signed(data.priceGrowth,-95,500)/100;

      demand*=
        1+signed(data.demandGrowth,-95,500)/100;
    }

    const sh=
      i+1>=n(shock.month,1,36)
        ? shock
        : cases.base;

    const demandUnits=
      Math.min(
        demand*Math.max(
          0,
          1+signed(sh.demand,-100,500)/100
        ),
        n(data.dailyCapacity)
      )*n(data.openDays,0,31);

    const bought=n(data.monthlyPurchases);

    const paid=
      bought*
      purchasePrice*
      Math.max(
        0,
        1+signed(sh.cost,-99,500)/100
      );

    const available=stock+bought;

    const average=available
      ? (stock*avgCost+paid)/available
      : 0;

    const shrink=
      available*n(data.shrinkage,0,100)/100;

    const units=Math.min(
      demandUnits,
      available-shrink
    );

    stock=Math.max(
      0,
      available-shrink-units
    );

    avgCost=average;

    const sales=
      units*
      sellingPrice*
      Math.max(
        0,
        1+signed(sh.price,-100,500)/100
      );

    const cogs=(units+shrink)*avgCost;

    const expenses=
      fixed*
      Math.max(
        0,
        1+signed(sh.fixed,-100,500)/100
      );

    const interest=debt*rate;

    const principal=Math.min(
      debt,
      Math.max(0,loanPayment-interest)
    );

    const repaid=debt
      ? principal+interest
      : 0;

    debt=Math.max(0,debt-principal);

    const profit=
      sales-cogs-expenses-interest;

    cash+=
      sales-paid-expenses-repaid;

    rows.push({
      month,
      sales,
      cogs,
      expenses,
      interest,
      profit,
      cash,
      inventory:stock*avgCost,
      stock,
      sold:units,
      missed:Math.max(0,demandUnits-units),
      purchaseCash:paid,
      loanPaid:repaid,
      debt,
      source:eco.status
    });
  }

  return rows;
}

function summary(rows) {
  const total=k=>rows.reduce(
    (s,r)=>s+r[k],0
  );

  const last=rows.at(-1);

  return {
    revenue:total("sales"),
    profit:total("profit"),
    cash:last.cash,
    inventory:last.inventory,
    missed:total("missed")
  };
}

// =======================================
// UI COMPONENTS
// =======================================

function heading(title,description,actions="") {
  return `
    <div class="heading">
      <div>
        <div class="eyebrow">
          SIMVEST / RETAIL & COMMERCE
        </div>
        <h1>${title}</h1>
        <p>${description}</p>
      </div>

// SVG graph for projected and real values
function plot(rows,key,actualByMonth=null) {
  const vals=rows.map(r=>r[key]);

  if(actualByMonth){
    rows.forEach(r=>{
      const actualKey=
        key==="sales"?"revenue":key;

      const a=actualByMonth[r.month]?.[actualKey];

      if(Number.isFinite(a)){
        vals.push(a);
      }
    });
  }

  let lo=Math.min(...vals);
  let hi=Math.max(...vals);

  if(lo===hi){
    hi+=1;
    lo-=1;
  }

  const X=i=>
    45+i*660/Math.max(1,rows.length-1);

  const Y=v=>
    224-(v-lo)/(hi-lo)*170;

  const line=rows.map((r,i)=>
    `${i?"L":"M"}${X(i).toFixed(1)},`+
    `${Y(r[key]).toFixed(1)}`
  ).join(" ");

  let actualPath="";
  let dots="";

  if(actualByMonth){
    let lastWasValid=false;

    rows.forEach((r,i)=>{
      const k=key==="sales"?"revenue":key;
      const v=actualByMonth[r.month]?.[k];

      if(Number.isFinite(v)){
        actualPath+=
          (lastWasValid?"L":"M")+
          X(i).toFixed(1)+","+
          Y(v).toFixed(1)+" ";

        dots+=`
          <circle
            cx="${X(i)}"
            cy="${Y(v)}"
            r="3.4"
            fill="#11a18e">
            <title>
              ${esc(r.month)}: ${esc(currency(v))}
            </title>
          </circle>
        `;

        lastWasValid=true;
      } else {
        lastWasValid=false;
      }
    });
  }

  return `
    <div class="chart">
      <svg
        viewBox="0 0 760 260"
        preserveAspectRatio="none"
        role="img"
        aria-label="${esc(key)} comparison over months">

        <line x1="45" y1="224"
          x2="712" y2="224" stroke="#dfe5ef"/>

        <line x1="45" y1="54"
          x2="712" y2="54"
          stroke="#e6eaf2"
          stroke-dasharray="5 5"/>

        <text x="5" y="57">
          ${esc(compact(hi))}
        </text>

        <text x="5" y="227">
          ${esc(compact(lo))}
        </text>

        <path
          d="${line}"
          stroke="#536ce5"
          stroke-width="3"
          fill="none"
          stroke-linejoin="round"/>

        ${actualByMonth?`
          <path
            d="${actualPath}"
            fill="none"
            stroke="#11a18e"
            stroke-width="3"
            stroke-linejoin="round"/>
          ${dots}
        `:""}

        <text x="45" y="251">
          ${rows[0].month}
        </text>

        <text x="631" y="251">
          ${rows.at(-1).month}
        </text>
      </svg>
    </div>

    <div class="legend">
      <span>
        <i class="dot"></i>SimVest simulated
      </span>

      ${actualByMonth?`
        <span>
          <i class="dot actual"></i>
          Actual business records
        </span>
      `:""}
    </div>
  `;
}

// =======================================
// MODEL VALIDATION ENGINE
// =======================================

// Real business records stay separate from
// simulation inputs.

function actualRows() {
  return Array.isArray(allActual[p.id])
    ? allActual[p.id]
    : [];
}

function actualMap() {
  return Object.fromEntries(
    actualRows().map(r=>[r.month,r])
  );
}

function compare(rows,fieldKey) {
  const simKey=metricFields[fieldKey].model;
  const by=actualMap();
  const joined=[];

  rows.forEach(r=>{
    const a=by[r.month]?.[fieldKey];

    if(Number.isFinite(a)){
      joined.push({
        month:r.month,
        simulated:r[simKey],
        actual:a,
        error:r[simKey]-a
      });
    }
  });

  return joined;
}

function metrics(rows) {
  if(!rows.length){
    return null;
  }

  const total=rows.reduce(
    (a,r)=>({
      abs:a.abs+Math.abs(r.error),
      actualAbs:a.actualAbs+Math.abs(r.actual),
      bias:a.bias+r.error
    }),
    {abs:0,actualAbs:0,bias:0}
  );

  return {
    mae:total.abs/rows.length,

    wape:total.actualAbs>0
      ? 100*total.abs/total.actualAbs
      : null,

    bias:total.bias/rows.length
  };
}

function download(text,filename) {
  const url=URL.createObjectURL(
    new Blob([text],{
      type:"text/csv;charset=utf-8"
    })
  );

  const a=document.createElement("a");

  a.href=url;
  a.download=filename;
  a.click();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },2000);
}

// =======================================
// CSV FILE PARSER
// =======================================

function parseCSV(input) {
  const rows=[];
  let row=[];
  let cell="";
  let quote=false;

  input=input.replace(/^\uFEFF/,"");

  for(let i=0;i<input.length;i++){
    const ch=input[i];

    if(quote){
      if(ch==='"'&&input[i+1]==='"'){
        cell+='"';
        i++;
      } else if(ch==='"'){
        quote=false;
      } else {
        cell+=ch;
      }
    } else if(ch==='"'){
      quote=true;
    } else if(ch===","){
      row.push(cell);
      cell="";
    } else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&input[i+1]==="\n"){
        i++;
      }

      row.push(cell);

      if(row.some(x=>x.trim())){
        rows.push(row);
      }

      row=[];
      cell="";
    } else {
      cell+=ch;
    }
  }

  if(quote){
    throw Error("Unclosed quotation mark in CSV");
  }

  row.push(cell);

  if(row.some(x=>x.trim())){
    rows.push(row);
  }

  return rows;
}

function parseAmount(x) {
  let t=String(x??"").trim();

  if(t===""){
    return null;
  }

  const negative=/^\(.+\)$/.test(t);

  t=t.replace(/[₦,\s()]/g,"");

  const v=Number(t);

  if(!Number.isFinite(v)||t===""){
    throw Error(
      "Invalid numeric amount: "+
      String(x).slice(0,40)
    );
  }

  return negative?-v:v;
}

// =======================================
// ACTUAL COMPANY RECORD IMPORT
// =======================================

function importActual(text) {
  const csv=parseCSV(text);

  if(csv.length<2){
    throw Error(
      "CSV needs a header and at least one data row"
    );
  }

  const headers=csv.shift().map(
    h=>h.trim().toLowerCase()
  );

  if(!headers.includes("month")){
    throw Error("Missing month column");
  }

  const keys=Object.keys(metricFields).filter(
    k=>headers.includes(k)
  );

  if(!keys.length){
    throw Error(
      "Add at least one metric: "+
      Object.keys(metricFields).join(", ")
    );
  }

  const map=new Map(
    actualRows().map(r=>[r.month,r])
  );

  let count=0;

  for(const [i,line] of csv.entries()){
    const obj=Object.fromEntries(
      headers.map((h,j)=>[h,line[j]??""])
    );

    if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(obj.month)){
      throw Error(
        "Invalid month on line "+(i+2)
      );
    }

    const values={};

    for(const k of keys){
      const val=parseAmount(obj[k]);

      if(val!==null){
        values[k]=val;
      }
    }

    if(!Object.keys(values).length){
      continue;
    }

    map.set(obj.month,{
      ...(map.get(obj.month)||{
        month:obj.month
      }),
      ...values
    });

    count++;
  }

  if(!count){
    throw Error("No numeric records imported");
  }

  allActual[p.id]=[...map.values()].sort(
    (a,b)=>a.month.localeCompare(b.month)
  );

  store(ACTUAL,allActual);

  return count;
}

// =======================================
// ECONOMIC DATA IMPORT
// =======================================

function importEconomic(text) {
  const csv=parseCSV(text);

  if(csv.length<2){
    throw Error(
      "CSV needs a header and data rows"
    );
  }

  const head=csv.shift().map(
    h=>h.trim().toLowerCase()
  );

  for(const x of [
    "metric","month","value","source"
  ]){
    if(!head.includes(x)){
      throw Error("Missing column "+x);
    }
  }

  const allowed=new Set([
    "cpi_mom",
    "cpi_yoy",
    "fx_ngn_usd",
    "petrol_ngn_litre"
  ]);

  const map=new Map(
    economic.records.map(
      r=>[r.metric+"|"+r.month,r]
    )
  );

  let count=0;

  for(const [i,row] of csv.entries()){
    const x=Object.fromEntries(
      head.map((h,j)=>[h,row[j]??""])
    );

    if(
      !allowed.has(x.metric) ||
      !/^\d{4}-(0[1-9]|1[0-2])$/.test(x.month) ||
      !x.source.trim()
    ){
      throw Error(
        "Invalid data at line "+(i+2)
      );
    }

    const value=parseAmount(x.value);

    if(
      value===null ||
      (
        (
          x.metric==="fx_ngn_usd" ||
          x.metric==="petrol_ngn_litre"
        ) &&
        value<=0
      )
    ){
      throw Error(
        "Invalid value on line "+(i+2)
      );
    }

    map.set(
      x.metric+"|"+x.month,
      {
        metric:x.metric,
        month:x.month,
        value,
        source:x.source
      }
    );

    count++;
  }

  economic.records=[...map.values()].sort(
    (a,b)=>a.month.localeCompare(b.month)
  );

  store(ECON,economic);

  return count;
}

// =======================================
// WORLD BANK DATA
// =======================================

async function fetchBank() {
  const r=await fetch(
    "https://api.worldbank.org/v2/country/NG/indicator/FP.CPI.TOTL.ZG?format=json&per_page=150"
  );

  if(!r.ok){
    throw Error(
      "World Bank HTTP "+r.status
    );
  }

  const json=await r.json();

  if(!Array.isArray(json[1])){
    throw Error("Unexpected API response");
  }

  const series={};

  json[1].forEach(x=>{
    if(
      x.value!==null &&
      Number.isFinite(Number(x.value))
    ){
      series[x.date]=Number(x.value);
    }
  });

  economic.annual=series;
  store(ECON,economic);

  return Object.keys(series).length;
}

$("navigation").addEventListener("click",ev=>{
  const btn=ev.target.closest("[data-page]");

  if(!btn)return;

  page=btn.dataset.page;
  $("sidebar").classList.remove("open");
  render();
});

$("menuButton").onclick=()=>{
  $("sidebar").classList.toggle("open");
};

$("saveButton").onclick=saveProject;

$("content").addEventListener("change",async ev=>{
  const el=ev.target;

  if(el.dataset.key){
    const key=el.dataset.key;

    const v=el.type==="number"
      ?Number(el.value)
      :el.value;

    if(key==="category"){
      const c=categories[v];

      if(!c)return;

      Object.assign(p,{
        category:v,
        price:c[1],
        unitCost:c[2],
        dailyDemand:c[3],
        dailyCapacity:c[4],
        openingUnits:c[5],
        monthlyPurchases:c[6]
      });

      render();
    } else {
      p[key]=v;
    }

    store(DRAFT,p);
  }

  if(el.dataset.custom){
    p.custom[el.dataset.custom]=Number(el.value);
    store(DRAFT,p);
    render();
  }

  if(el.id==="actualFile"&&el.files?.length){
    const file=el.files[0];

    if(file.size>1024*1024){
      notify("Maximum file size: 1 MB");
      return;
    }

    try {
      const count=importActual(
        await file.text()
      );

      notify(
        `Imported ${count} actual months`
      );

      render();
    } catch(err){
      notify(err.message);
    }
  }
});

$("content").addEventListener("click",async ev=>{
  const b=ev.target.closest("button");

  if(!b)return;

  if(b.dataset.go){
    page=b.dataset.go;
    render();

  } else if(b.dataset.metric){
    metric=b.dataset.metric;
    render();

  } else if(b.dataset.compare){
    validationMetric=b.dataset.compare;
    render();

  } else if(b.dataset.scenario){
    scenario=b.dataset.scenario;
    render();

  } else if(b.id==="exportSimulation"){
    exportSimulation();

  } else if(b.id==="downloadTemplate"){
    template();

  } else if(b.id==="importActual"){
    try {
      const count=importActual(
        $("actualText").value
      );

      notify(
        `Imported ${count} actual months`
      );

      render();
    } catch(e){
      notify(e.message);
    }

  } else if(b.id==="clearActual"){
    if(confirm(
      "Delete the actual records for this business?"
    )){
      delete allActual[p.id];
      store(ACTUAL,allActual);
      render();
    }

  } else if(b.id==="importEconomic"){
    try {
      const count=importEconomic(
        $("econText").value
      );

      notify(
        `Imported ${count} economic observations`
      );

      render();
    } catch(e){
      notify(e.message);
    }

  } else if(b.id==="clearEconomic"){
    if(confirm(
      "Delete imported monthly economic observations?"
    )){
      economic.records=[];
      store(ECON,economic);
      render();
    }

  } else if(b.id==="fetchBank"){
    b.disabled=true;
    b.textContent="Fetching…";

    try {
      const count=await fetchBank();

      notify(
        `Loaded ${count} annual CPI records`
      );

      render();
    } catch(e){
      b.disabled=false;
      b.textContent="Fetch annual CPI";

      notify(
        "Could not fetch data: "+e.message
      );
    }

  } else if(b.id==="newProject"){
    p=defaults();
    store(DRAFT,p);
    page="setup";
    render();

  } else if(b.dataset.open!==undefined){
    const item=read(SAVED,[])[
      Number(b.dataset.open)
    ];

    if(item){
      p={
        ...defaults(),
        ...item,
        custom:{
          ...defaults().custom,
          ...item.custom
        }
      };

      store(DRAFT,p);
      page="dashboard";
      render();
    }

  } else if(b.dataset.delete!==undefined){
    if(confirm("Delete saved business?")){
      const projects=read(SAVED,[]);

      projects.splice(
        Number(b.dataset.delete),1
      );

      store(SAVED,projects);
      render();
    }
  }
});

render();
