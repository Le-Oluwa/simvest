
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213b">
  <title>SimVest | Business Simulation Studio</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="economic-data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon">◆</span> simvest
        <small>BUSINESS SIMULATOR</small>
      </div>
      <p class="side-label">WORKSPACE</p>
      <nav id="navigation" aria-label="Main navigation">
        <button class="nav-link active" data-page="dashboard">▦ &nbsp; Dashboard</button>
        <button class="nav-link" data-page="setup">◫ &nbsp; Business setup</button>
        <button class="nav-link" data-page="simulation">⌁ &nbsp; Simulation</button>
        <button class="nav-link" data-page="scenarios">⑃ &nbsp; Scenarios</button>
        <button class="nav-link" data-page="data">◉ &nbsp; Economic data</button>
        <button class="nav-link" data-page="saved">◷ &nbsp; Saved projects</button>
      </nav>
      <div class="side-note">
        SimVest • Retail & Commerce
        <br>
        Prototype simulation, not financial advice.
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <button class="menu" id="menuButton" aria-label="Open menu">☰</button>
          <strong>Workspace</strong>
          <span class="muted">/ <span id="pageTitle">Dashboard</span></span>
        </div>
        <div class="top-actions">
          <span class="chip">🇳🇬 Nigeria</span>
          <button class="btn primary" id="saveButton">Save project</button>
        </div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
